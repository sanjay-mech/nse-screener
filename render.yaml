# Render Blueprint Specification
# Deploys: 1 PostgreSQL Database, 1 Web Service (Dashboard/API), 1 Background Worker (Scanner)

services:
  # 1. Web Service: FastAPI Live Dashboard & Health Monitoring
  - type: web
    name: nse-screener-web
    runtime: python
    region: singapore # Closest low-latency region to NSE (India)
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.dashboard:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: nse-screener-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: POLL_INTERVAL_SEC
        value: "45"

  # 2. Background Worker: Real-Time Scanning & Scheduler Loop
  - type: worker
    name: nse-screener-worker
    runtime: python
    region: singapore
    plan: starter # Starter plan recommended to avoid free-tier idle sleeping
    buildCommand: pip install -r requirements.txt
    startCommand: python -m engine.runner
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: nse-screener-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: POLL_INTERVAL_SEC
        value: "45"

databases:
  # 3. Managed PostgreSQL Database
  - name: nse-screener-db
    region: singapore
    plan: starter
    databaseName: nse_screener
    user: screener_admin
