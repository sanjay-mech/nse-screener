version: '3.8'

services:
  screener:
    build: .
    container_name: nse-breakout-screener
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
    env_file:
      - .env
    volumes:
      - ./screener.db:/app/screener.db
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
